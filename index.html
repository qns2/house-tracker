<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Tracker</title>
<style>
:root{--bg:#151524;--card:#1e1e30;--accent:#7f8ff4;--good:#4fd08a;--bad:#e4796b;--warn:#e0b45c;--muted:#9aa0b5;--muted2:#6d7389;--border:#2c2c44;--text:#e8eaf6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
a{color:#9fb0ff}
header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#181828;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0 8px 0 0;font-weight:600}
.fresh{font-size:12.5px;color:var(--muted);line-height:1.35}
.fresh b{color:#c6cbe0}
.btn{background:#26263d;color:#dfe3ff;border:1px solid #3a3a58;border-radius:9px;padding:8px 14px;font-size:13.5px}
.btn:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,.mini-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls select,.controls input[type=search]{background:#20203a;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px}
.controls input[type=search]{min-width:220px}
#summary{font-size:12.5px;color:var(--muted);margin-left:auto}
#listings{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding:16px 18px 40px;grid-auto-rows:min-content}
@media(max-width:900px) and (min-width:641px){#listings{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
@media(max-width:640px){#listings{grid-template-columns:1fr;padding:10px}header{padding:10px}.controls{padding:8px 10px}.controls input[type=search]{min-width:0;flex:1 1 140px}}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card.top{border-color:#4d4d7a}
.card.removed{opacity:.55}
.card-img{position:relative;height:150px;background:#101020;display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:cover;decoding:async}
.no-photo{color:var(--muted2);font-size:12px}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:92%}
.card-badge{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:7px;background:#000000b0}
.badge-newmarket{color:#9ff0c5}.badge-newdisc{color:#c4a9ff}.badge-updated{color:#ffd58e}.badge-removed{color:#ff9d94}.badge-review{color:#a8d8ff}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-price{font-size:21px;font-weight:700}
.card-price .grp-vals{display:block;font-size:13px;font-weight:600;color:#d5d9f5}
.mv-down{color:var(--good)}.mv-up{color:var(--bad)}.mv-flat{color:var(--muted)}
.old-price{font-size:13px;color:var(--muted2);text-decoration:line-through}
.score-chip{font-size:12px;background:#262640;border-radius:8px;padding:4px 8px;text-align:right;line-height:1.25}
.score-chip .s{font-weight:700;font-size:15px;color:#cdd3ff}
.score-chip .c{color:var(--muted)}
.card-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.card-area{font-size:13px}
.card-area .act{color:#c9cff2;font-weight:600}
.card-area .mut{color:var(--muted2);text-decoration:line-through}
.loc-warn{color:var(--warn);font-size:11.5px}
.card-desc{font-size:12.5px;color:#b9bfd8;max-height:37px;overflow:hidden;line-height:1.32}
.cons{font-size:12px;display:flex;flex-wrap:wrap;gap:4px}
.cons span{background:#20203a;border-radius:6px;padding:2px 8px;color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cons .pro{color:#9ff0c5}.cons .con{color:#ffb0a6}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;border-radius:6px;padding:2.5px 8px;background:#232347;color:#aab2d5}
.tag.yes{color:#9ff0c5}.tag.no{color:#c9a0ff}.tag.mid{color:#ffd58e}
.grp-chip{font-size:11.5px;color:var(--warn);background:#2b2536;border-radius:6px;padding:3px 8px;border:none}
.grp-chip.pos{color:#9aa0b5}
.val-chip{font-size:11.5px;color:var(--muted)}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:2px}
.mini-btn{font-size:15px;background:#23233c;border:1px solid #3a3a58;border-radius:8px;padding:6px 10px;min-width:44px;min-height:36px;text-align:center;color:#dfe3ff}
.mini-btn.on{border-color:var(--accent);color:#fff;background:#2b2b52}
.rev-note{font-size:11.5px;color:var(--warn)}
.card-foot{margin-top:auto}
.card-foot a{font-size:13px;text-decoration:none}
.empty{padding:30px;color:var(--muted);grid-column:1/-1;text-align:center}
#modal{position:fixed;inset:0;background:#000000b8;display:none;align-items:flex-start;justify-content:center;z-index:50;padding:24px 12px;overflow:auto}
#modal.open{display:flex}
#modal .panel{background:#1c1c2e;border:1px solid var(--border);border-radius:14px;max-width:780px;width:100%;padding:20px 22px;max-height:calc(100vh - 40px);overflow:auto}
#modal h2{margin:0 0 2px;font-size:20px}
#modal h3{margin:16px 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#modal .close{float:right;font-size:22px;background:none;border:none;color:var(--muted);min-width:44px;min-height:40px}
#modal table{border-collapse:collapse;width:100%;font-size:13px}
#modal td{padding:4px 8px;border-bottom:1px solid #2a2a42;vertical-align:top;overflow-wrap:anywhere}
#modal td.v{color:#cdd3ff;font-weight:600}
#modal .ev{color:var(--muted2);font-size:11.5px}
#modal .ph a{display:inline-block;margin:3px 8px 3px 0;font-size:13px}
#modal .frow td{border-bottom:none;padding:2.5px 8px}
#modal .adrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #2a2a42;font-size:13px}
#modal .adrow .sp{color:var(--muted)}
#modal .histrow{display:flex;flex-wrap:wrap;gap:10px;padding:5px 0;border-bottom:1px solid #2a2a42;font-size:13px;align-items:baseline}
#modal .histrow .d{color:var(--muted);min-width:96px}
#modal .histrow .p{font-weight:600;color:#cdd3ff}
#modal .histrow .c{font-size:12px}
.fmissing{color:var(--muted2)}
</style>
</head>
<body>
<header>
  <h1>House Tracker</h1>
  <button class="btn" id="refreshBtn" aria-label="Reload listings from the local store (no new portal scan)">Reload data</button>
  <button class="btn" id="exportBtn" aria-label="Export your review decisions as a file">Export reviews</button>
  <button class="btn" id="importBtn" aria-label="Import review decisions from a file">Import</button>
  <input type="file" id="importFile" accept="application/json" style="display:none" aria-hidden="true" tabindex="-1">
  <div class="fresh" id="freshness" aria-live="polite">loading…</div>
  <div id="summary"></div>
</header>
<div class="controls">
  <label for="filter" style="color:var(--muted);font-size:12.5px">Filter</label>
  <select id="filter" onchange="render()">
    <option value="verified" selected>Unique properties</option>
    <option value="all">All ads (ungrouped)</option>
    <option value="newmarket">New on market</option>
    <option value="newdisc">Newly discovered</option>
    <option value="updated">Updated / price moved</option>
    <option value="shortlisted">Shortlisted</option>
    <option value="reviewed">Reviewed</option>
    <option value="dismissed">Dismissed</option>
    <option value="grouped">Duplicates &amp; multi-listed</option>
    <option value="removed">Removed</option>
    <option value="reduced">Price reduced</option>
    <option value="increased">Price increased</option>
    <option value="top">Top by score</option>
    <option value="A_investment_1br">1-Bed Investment (NS)</option>
    <option value="B_residence_2br">2-Bed Residence (NS)</option>
    <option value="C_piraeus_univ_1br">Piraeus Univ 1-Bed</option>
    <option value="legacy">Snapshot cards only</option>
  </select>
  <label for="sort" style="color:var(--muted);font-size:12.5px">Sort</label>
  <select id="sort" onchange="render()">
    <option value="score">Best score</option>
    <option value="drop_pct">Biggest price reduction (%)</option>
    <option value="drop_abs">Biggest price reduction (€)</option>
    <option value="change_recent">Most recent change (any direction)</option>
    <option value="price_asc">Price low→high</option>
    <option value="price_desc">Price high→low</option>
    <option value="pps_asc">€/sqm low→high</option>
    <option value="pps_desc">€/sqm high→low</option>
    <option value="size_desc">Size large→small</option>
    <option value="newest">Latest published/discovered</option>
  </select>
  <input type="search" id="search" placeholder="Search visible fields: area, keywords, price…" oninput="render()" aria-label="Search listings">
</div>
<main id="listings" tabindex="-1"><div class="empty">Loading listings…</div></main>

<div id="modal" role="dialog" aria-modal="true" aria-label="Listing details" onclick="if(event.target===this)closeModal()">
  <div class="panel" id="modalPanel"></div>
</div>

<script>
let allListings=[],meta={},groupIndex={},searchStrings=new Map();
const REV_KEY='houseTracker.reviews.v1', UI_KEY='houseTracker.ui.v1';
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pps(l){const p=l.price_effective||l.price_eur;return (p&&l.size_sqm>0)?p/l.size_sqm:1e9}
const effPrice=l=>l.price_effective||l.price_eur||1e9;
function money(n){return n?Number(n).toLocaleString('en-US')+' €':''}
function fmtShort(iso){return iso?iso.slice(8,10)+'/'+iso.slice(5,7):'—'}
function reviews(){try{return JSON.parse(localStorage.getItem(REV_KEY))||{}}catch(e){return{}}}

async function loadAll(){
  try{
    const t0=performance.now();
    const[lRes,mRes]=await Promise.all([
      fetch('api/listings').then(r=>r.json()),
      fetch('api/meta').then(r=>r.json()).catch(()=>({}))
    ]);
    allListings=lRes;meta=mRes||{};
    buildSearchStrings();buildGroupIndex();
    document.getElementById('refreshBtn').textContent='Reloaded '+new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});
    render();
    window.__lastLoadMs=Math.round(performance.now()-t0);
  }catch(e){
    document.getElementById('listings').innerHTML='<div class="empty">Data unavailable: '+esc(String(e))+'</div>';
  }
}

function buildSearchStrings(){
  // search only what the user can SEE (no hidden JSON blob matching)
  searchStrings=new Map();
  for(const l of allListings){
    const ch=l.characteristics||{};
    const loc=l.location||{};
    const parts=[String(l.id),l.area,l.desc,l.status_label,l.status,l.renovation,l.energy_class,
      loc.actual_city,loc.advertised,loc.title_city,(loc.actual_tags||[]).join(' '),
      ch.renovation&&ch.renovation.label,(ch.energy_class||{}).value,
      (l.size_sqm!=null)?l.size_sqm+'sqm':'',(l.price_eur!=null)?l.price_eur+'€':'',
      l.floor?l.floor+' ορόφου':'',l.bedrooms?l.bedrooms+' bd':''];
    searchStrings.set(l.id,parts.filter(Boolean).join(' ').toLowerCase());
  }
}

function buildGroupIndex(){
  // likely multi-ad groups collapse to one primary card; 'possible' stays individual
  groupIndex={};memberListings=new Map();
  const byId=new Map(allListings.map(l=>[l.id,l]));
  for(const l of allListings){
    const g=l.group;
    if(g&&g.property_id&&g.level==='likely'&&g.n_ads>1&&Array.isArray(g.ads)){
      groupIndex[g.property_id]=g;
      const members=(g.ads||[]).map(a=>byId.get(a.ad_id)).filter(Boolean);
      memberListings.set(g.primary_id,members.length?members:[l]);
    }
  }
}
// all rows representing the same physical property as l (l itself when ungrouped)
function memberRows(l){
  const g=l.group&&groupIndex[l.group.property_id];
  if(!g)return [l];
  return (g.primary_id===l.id?(memberListings.get(l.id)||[l]):[l]) ;
}
function rowMatches(l,filter,rev){
  const label=l.status_label||'';
  switch(filter){
    case'verified':case'all':return true;
    case'legacy':return !l.url;
    case'newmarket':return label==='NEW ON MARKET';
    case'newdisc':return label==='NEWLY DISCOVERED';
    case'updated':return label==='UPDATED'||((l.movement||{}).direction==='down')||((l.movement||{}).direction==='up');
    case'reduced':return !!(l.movement&&l.movement.reduced);
    case'increased':return !!(l.movement&&l.movement.increased);
    case'grouped':return !!(l.group&&l.group.n_ads>1);
    case'removed':return !!(l.status&&(l.status+'').indexOf('removed')>-1);
    case'top':return (l.score_v2||l.score||0)>=55;
    case'shortlisted':return !!(rev[l.id]&&rev[l.id].state==='shortlist');
    case'reviewed':return !!(rev[l.id]&&rev[l.id].state==='reviewed');
    case'dismissed':return !!(rev[l.id]&&rev[l.id].state==='dismissed');
    case'A_investment_1br':case'B_residence_2br':case'C_piraeus_univ_1br':
      return (l.search_ids||[]).includes(filter);
  }
  return true;
}
// Property-level filters evaluate EVERY member advertisement of a likely group,
// so a secondary ad's reduction/shortlist/update/profile never hides the property.
const MEMBER_FILTERS=['newmarket','newdisc','updated','reduced','increased',
                      'shortlisted','reviewed','A_investment_1br','B_residence_2br','C_piraeus_univ_1br'];
function matchesFilter(l,filter,rev){
  if(MEMBER_FILTERS.indexOf(filter)>=0)return memberRows(l).some(m=>rowMatches(m,filter,rev));
  return rowMatches(l,filter,rev);
}

function propertyView(filter){
  // for the default views, likely duplicate groups collapse to their primary ad
  const GROUPED=['verified','newmarket','newdisc','updated','reduced','increased','top',
                 'shortlisted','reviewed','A_investment_1br','B_residence_2br','C_piraeus_univ_1br'];
  const rev=reviews();
  if(GROUPED.indexOf(filter)<0)return allListings;
  const suppress=new Set();
  for(const pid in groupIndex){
    const g=groupIndex[pid];
    for(const a of g.ads)if(a.ad_id!==g.primary_id)suppress.add(a.ad_id);
  }
  return allListings.filter(l=>!suppress.has(l.id));
}

function currentList(){
  const filter=document.getElementById('filter').value;
  const rev=reviews();
  const search=(document.getElementById('search').value||'').toLowerCase();
  // dismissed primary must not hide other member ads of the same property
  const notDismissed=l=>filter==='dismissed'||memberRows(l).some(m=>!(rev[m.id]&&rev[m.id].state==='dismissed'));
  // grouped view stays grouped while searching: an ad that matches inside a
  // likely duplicate group promotes its primary card instead of adding the member
  const base=propertyView(filter).filter(l=>matchesFilter(l,filter,rev)&&notDismissed(l));
  if(!search)return base;
  const memberHits=new Set();
  for(const l of allListings){
    const g=l.group&&groupIndex[l.group.property_id];
    if(g&&l.id!==g.primary_id&&base.some(p=>p.id===g.primary_id)&&
       (searchStrings.get(l.id)||'').includes(search))memberHits.add(g.primary_id);
  }
  return base.filter(l=>(searchStrings.get(l.id)||'').includes(search)||memberHits.has(l.id));
}

function render(){
  const filter=document.getElementById('filter').value;
  const sort=document.getElementById('sort').value;
  const search=(document.getElementById('search').value||'').toLowerCase();
  const list=currentList();
  // property-level movement: the most recent/largest movement across the group's ads
  const propMovement=l=>{
    let best=null;
    for(const m of memberRows(l)){const mv=m.movement||{};
      if(mv.direction==='down'||mv.direction==='up'){
        if(!best||(mv.previous_date||'')>(best.previous_date||''))best=mv;}}
    return best||l.movement||{};
  };
  // REDUCTIONS ONLY: an increase is never ranked as a reduction; no offset tricks.
  const dropPct=l=>{const mv=propMovement(l);return (mv&&mv.reduced&&mv.pct_change!=null)?Math.abs(mv.pct_change):-1;};
  const dropAbs=l=>{const mv=propMovement(l);return (mv&&mv.reduced&&mv.abs_change!=null)?Math.abs(mv.abs_change):-1;};
  const changeDate=l=>((propMovement(l)||{}).previous_date||'2000-01-01');
  const dateOf=l=>(l.dates&&(l.dates.published||l.dates.first_seen))||l.first_seen||'';
  list.sort((a,b)=>{
    switch(sort){
      case'drop_pct':return dropPct(b)-dropPct(a);
      case'drop_abs':return dropAbs(b)-dropAbs(a);
      case'change_recent':return new Date(changeDate(b))-new Date(changeDate(a));
      case'price_asc':return effPrice(a)-effPrice(b);
      case'price_desc':return (b.price_effective||b.price_eur||0)-(a.price_effective||a.price_eur||0);
      case'pps_asc':return pps(a)-pps(b);
      case'pps_desc':return pps(b)-pps(a);
      case'size_desc':return(b.size_sqm||0)-(a.size_sqm||0);
      case'newest':return dateOf(b).localeCompare(dateOf(a));
      default:return(b.score_v2!=null?b.score_v2:(b.score||0))-(a.score_v2!=null?a.score_v2:(a.score||0));
    }
  });
  const uniqueN=list.filter(l=>l.group&&groupIndex[l.group.property_id]&&l.id===groupIndex[l.group.property_id].primary_id).length;
  const shortN=Object.keys(reviews()).filter(k=>reviews()[k].state==='shortlist').length;
  document.getElementById('summary').textContent=
    list.length+' shown'+(uniqueN?' ('+uniqueN+' primary cards of grouped properties)':'')+' · '+
    shortN+' shortlisted · '+(meta.groups_likely||'?')+' confirmed dup groups ('+(meta.groups||0)+' total)';
  document.getElementById('freshness').innerHTML=
    'Last data collection: <b>'+(meta.last_scan_at?fmtShort(meta.last_scan_at)+' '+(meta.last_scan_at||'').slice(11,16):'unknown')+
    '</b> · detail refresh ~09:00 + vision harvest 11:00 (Athens local) · page reloaded <b>'+new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})+'</b>';

  const container=document.getElementById('listings');
  if(list.length===0){container.innerHTML='<div class="empty">No listings match this filter.</div>';return}
  container.innerHTML=list.map(l=>cardHtml(l,reviews())).join('');
}

function cardHtml(l,rev){
  const mv=l.movement||{direction:'unknown'};
  const label=l.status_label||'';
  const isRemoved=l.status&&(l.status+'').indexOf('removed')>-1;
  const rv=rev[l.id]||{};
  const pricePerSqm=(l.price_eur&&l.size_sqm>0)?Math.round(l.price_eur/l.size_sqm):null;
  const score=(l.score_v2!=null)?l.score_v2:(l.score||0);
  const prof=l.score_v2_profile||'';
  const ch=l.characteristics||{};
  const loc=l.location||{};
  const d=l.dates||{};
  const g=l.group&&groupIndex[l.group.property_id];
  const isPrimaryGroup=g&&l.id===g.primary_id;
  const thumb=l.thumb;
  const rvChanged=rv.snap&&rv.snap.price&&l.price_eur&&rv.snap.price!==l.price_eur;

  let badges='';
  if(label==='NEW ON MARKET')badges+='<span class="card-badge badge-newmarket">NEW ON MARKET</span>';
  else if(label==='NEWLY DISCOVERED')badges+='<span class="card-badge badge-newdisc">NEWLY DISCOVERED</span>';
  else if(label==='UPDATED')badges+='<span class="card-badge badge-updated">UPDATED</span>';
  else if(label==='REMOVED')badges+='<span class="card-badge badge-removed">REMOVED</span>';
  if(isRemoved)badges+='<span class="card-badge badge-removed">GONE</span>';
  if(rvChanged)badges+='<span class="card-badge badge-updated">CHANGED</span>';
  if(rv.state==='shortlist')badges+='<span class="card-badge badge-review">★ SHORTLIST</span>';
  else if(rv.state==='reviewed')badges+='<span class="card-badge badge-review">✓ REVIEWED</span>';
  if(isPrimaryGroup){
    badges+='<span class="card-badge badge-review">⧉ '+g.n_ads+' ADS</span>';
    // explain when a GROUP MEMBER (not the primary ad) carries the signal
    const members=memberListings.get(l.id)||[];
    if(members.some(m=>m.id!==l.id&&m.movement&&m.movement.reduced))
      badges+='<span class="card-badge badge-updated">↓ PRICE DROP IN MEMBER AD</span>';
    if(members.some(m=>m.id!==l.id&&rev[m.id]&&rev[m.id].state==='shortlist'))
      badges+='<span class="card-badge badge-review">★ MEMBER SHORTLISTED</span>';
    if(members.some(m=>m.id!==l.id&&(m.search_ids||[]).some(s=>!(l.search_ids||[]).includes(s))))
      badges+='<span class="card-badge badge-review">⧉ ALSO IN OTHER SEARCH</span>';
  }

  let mvHtml='';
  if(mv.direction==='down'&&mv.pct_change!=null)
    mvHtml='<span class="mv-down">↓ '+Math.abs(mv.abs_change).toLocaleString('en-US')+' € ('+(mv.pct_change<0?'−':'+')+Math.abs(mv.pct_change).toFixed(1)+'%)</span>';
  else if(mv.direction==='up'&&mv.pct_change!=null)
    mvHtml='<span class="mv-up">↑ '+mv.abs_change.toLocaleString('en-US')+' € (+'+mv.pct_change.toFixed(1)+'%)</span>';

  const pro=(l.score_strengths||[]).slice(0,2).map(s=>'<span class="pro">✓ '+esc(s.split('(')[0].trim())+'</span>');
  const con=(l.score_weaknesses||[]).slice(0,2).map(s=>'<span class="con">✗ '+esc(s.split('(')[0].trim())+'</span>');
  let consHtml='';
  if(pro.length||con.length)consHtml='<div class="cons">'+pro.join('')+con.join('')+'</div>';

  let tags='';
  if((ch.elevator||{}).state==='yes')tags+='<span class="tag yes">Elevator</span>';
  else if((ch.elevator||{}).state==='no')tags+='<span class="tag no">No elevator</span>';
  if((ch.heating_gas||{}).state==='yes')tags+='<span class="tag yes">Gas</span>';
  if((ch.heating||{}).label&&ch.heating.state!=='unknown')tags+='<span class="tag mut">'+esc(ch.heating.label)+'</span>';
  if((ch.parking||{}).state==='yes')tags+='<span class="tag yes">Parking</span>';
  else if((ch.parking||{}).state==='no')tags+='<span class="tag no">No parking</span>';
  if((ch.storage||{}).state==='yes')tags+='<span class="tag yes">Storage</span>';
  if((ch.furnished||{}).state==='yes')tags+='<span class="tag yes">Furnished</span>';
  else if((ch.furnished||{}).state==='no')tags+='<span class="tag no">Unfurnished</span>';
  if(l.renovation){
    const rs=(ch.renovation||{}).state;
    const rc=(rs==='needs_renovation'||rs==='not_claimed')?'no':(rs==='partially_renovated'?'mid':(rs==='conflict'||rs==='unknown'?'mut':'yes'));
    tags+='<span class="tag '+rc+'">'+esc(l.renovation)+'</span>';
  }
  if((ch.no_commission||{}).state==='yes')tags+='<span class="tag yes">No commission</span>';
  const ecParsed=(ch.energy_class||{}).value;
  const ecState=(ch.energy_class||{}).state;
  if(ecParsed||l.energy_class)tags+='<span class="tag">Energy '+esc(ecParsed||l.energy_class)+'</span>';
  else if(ecState==='exempt')tags+='<span class="tag mut">Energy: no certificate required (exempt)</span>';
  else if(ecState==='pending')tags+='<span class="tag mut">Energy: certificate pending</span>';
  if(l.stale)tags+='<span class="tag no">Not seen since '+fmtShort(d.last_seen)+'</span>';

  const city=loc.actual_city?loc.actual_city[0].toUpperCase()+loc.actual_city.slice(1):'';
  let areaHtml='<div class="card-area"><span class="act">'+esc(loc.actual_city?city:(l.area||'Unknown area'))+'</span>';
  if(loc.mismatch&&loc.advertised)areaHtml+=' <span class="mut">advertised: '+esc(loc.advertised)+'</span>';
  if(loc.mismatch)areaHtml+=' <span class="loc-warn">⚠ mismatched location</span>';
  else if(loc.ambiguous)areaHtml+=' <span class="loc-warn">⚠ multiple areas</span>';
  areaHtml+='</div>';

  let grp='';
  if(isPrimaryGroup){
    const pr=g.prices_all||[];
    grp='<button class="grp-chip" onclick="openGroup(\''+esc(g.property_id)+'\')" title="Show every advertisement for this property">⧉ '+g.n_ads+' ads'+(pr.length>1?' · '+money(Math.min.apply(null,pr))+'–'+money(Math.max.apply(null,pr)):'')+' — view all</button>';
  }else if(l.group&&l.group.n_ads>1){
    grp='<span class="grp-chip pos">⚠ possible duplicate ('+l.group.n_ads+' ads — verify manually)</span>';
  }
  let val='';
  if(l.valuation&&l.valuation.diff_pct_vs_median!=null)
    val='<span class="val-chip">'+(l.valuation.diff_pct_vs_median>0?'+':'')+l.valuation.diff_pct_vs_median+'% vs median ('+l.valuation.n_comparables+')</span>';

  const dateStr=d.published&&d.published_missing===false?('published '+fmtShort(d.published)):(d.first_seen?('discovered '+fmtShort(d.first_seen)):'');
  const rvNote=rv.note?'<span class="rev-note">📝 '+esc(rv.note)+'</span>':'';
  const cls=isRemoved?'card removed':((l.score_v2||0)>=55?'card top':'card');
  return '<div class="'+cls+'" data-id="'+esc(l.id)+'">'+
    '<div class="card-img">'+(thumb?'<img loading="lazy" decoding="async" src="'+esc(thumb)+'" alt="Photo of the advertised apartment">':'<span class="no-photo">No photo</span>')+'<div class="badges">'+badges+'</div></div>'+
    '<div class="card-body">'+
    '<div class="card-top"><div><div class="card-price">'+money(l.price_eur)+
    (isPrimaryGroup&&g.prices_all&&g.prices_all.length>1?'<span class="grp-vals">'+g.n_ads+' asking prices: '+g.prices_all.map(p=>money(p)).join(' · ')+'</span>':'')+
    (mv.previous?' <span class="old-price">was '+money(mv.previous)+'</span>':'')+
    '</div><div>'+mvHtml+'</div></div>'+
    '<div class="score-chip" title="score 0-100 (profile '+(esc(prof)||'')+'); D = data confidence %"><span class="s">'+(score!=null?score:'—')+'</span> '+prof+'<br><span class="c">D '+(l.data_confidence!=null?l.data_confidence+'%':'?%')+'</span></div></div>'+
    '<div class="card-meta"><span>'+(l.size_sqm>0?esc(String(l.size_sqm)):'?')+'sqm</span><span>'+(l.floor!=null&&l.floor!==''?esc(String(l.floor)).slice(0,4)+' fl':'fl —')+'</span><span>'+(l.bedrooms!=null&&l.bedrooms!==''?l.bedrooms+' bd':'bd —')+'</span>'+(pricePerSqm?'<span>'+pricePerSqm+' €/sqm</span>':'')+'<span>'+esc(dateStr||'')+'</span></div>'+
    areaHtml+
    '<div class="card-meta">'+grp+(val?'<span>'+val+'</span>':'')+'</div>'+
    (l.desc?'<div class="card-desc">'+esc(l.desc)+'</div>':'')+
    consHtml+
    '<div class="card-tags">'+tags+'</div>'+
    rvNote+
    '<div class="card-actions">'+
    '<button class="mini-btn '+(rv.state==='shortlist'?'on':'')+'" onclick="setReview(\''+esc(l.id)+'\',\'shortlist\')" aria-label="Shortlist this listing" title="Shortlist">★</button>'+
    '<button class="mini-btn '+(rv.state==='reviewed'?'on':'')+'" onclick="setReview(\''+esc(l.id)+'\',\'reviewed\')" aria-label="Mark reviewed" title="Reviewed">✓</button>'+
    '<button class="mini-btn '+(rv.state==='dismissed'?'on':'')+'" onclick="setReview(\''+esc(l.id)+'\',\'dismissed\')" aria-label="Dismiss this listing" title="Dismiss">✗</button>'+
    '<button class="mini-btn" onclick="addNote(\''+esc(l.id)+'\')" aria-label="Add personal note" title="Note">📝</button>'+
    '<button class="btn" style="padding:6px 12px" onclick="openModal(\''+esc(l.id)+'\')" aria-label="Open full listing details">Details</button>'+
    '</div>'+
    '<div class="card-foot">'+(l.url?'<a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">View advertisement →</a>':'<span class="tag">snapshot card — no source link</span>')+'</div>'+
    '</div></div>';
}

function setReview(id,state){
  const rev=reviews();
  const cur=rev[id]||{};
  const l=(allListings.find(x=>x.id===id))||{};
  rev[id]={state:(cur.state===state?'none':state),note:cur.note||'',at:new Date().toISOString(),snap:{price:l.price_eur,label:l.status_label||''}};
  localStorage.setItem(REV_KEY,JSON.stringify(rev));
  refreshAfterReview(id);
}
function addNote(id){
  const rev=reviews();const cur=rev[id]||{};
  const n=prompt('Personal note:',cur.note||'');
  if(n===null)return;
  const l=(allListings.find(x=>x.id===id))||{};
  rev[id]={state:cur.state||'none',note:n,at:new Date().toISOString(),snap:cur.snap||{price:l.price_eur}};
  localStorage.setItem(REV_KEY,JSON.stringify(rev));
  refreshAfterReview(id);
}
// A review-state change alters filter MEMBERSHIP (Shortlist/Reviewed/Dismissed
// views). Re-render the visible list so cards and summary counts always agree,
// then restore keyboard focus to the acting card.
function refreshAfterReview(id){
  render();
  const node=document.getElementById('listings').querySelector('[data-id="'+CSS.escape(id)+'"] .card-actions');
  if(node){const btn=node.querySelector('.mini-btn.on')||node.querySelector('.mini-btn');if(btn)btn.focus();}
}
function updateSummaryLine(){
  const rev=reviews();
  const n=currentList().length;
  document.getElementById('summary').textContent=n+' shown · '+
    Object.keys(rev).filter(k=>rev[k].state==='shortlist').length+' shortlisted · '+(meta.groups||0)+' dup groups';
}
// small interactions patch the rendered card in place instead of rebuilding the grid
function updateCardInPlace(id){
  const node=document.getElementById('listings').querySelector('[data-id="'+id+'"]');
  if(!node){render();return}
  const l=(allListings.find(x=>x.id===id))||{};
  const rev=reviews()[id]||{};
  const pricePerSqm=(l.price_eur&&l.size_sqm>0)?Math.round(l.price_eur/l.size_sqm):null;
  const rvChanged=rev.snap&&rev.snap.price&&l.price_eur&&rev.snap.price!==l.price_eur;
  const label=l.status_label||'';
  let badges='';
  if(label==='NEW ON MARKET')badges+='<span class="card-badge badge-newmarket">NEW ON MARKET</span>';
  else if(label==='NEWLY DISCOVERED')badges+='<span class="card-badge badge-newdisc">NEWLY DISCOVERED</span>';
  else if(label==='UPDATED')badges+='<span class="card-badge badge-updated">UPDATED</span>';
  if((l.status+'').indexOf('removed')>-1)badges+='<span class="card-badge badge-removed">GONE</span>';
  if(rvChanged)badges+='<span class="card-badge badge-updated">CHANGED</span>';
  if(rev.state==='shortlist')badges+='<span class="card-badge badge-review">★ SHORTLIST</span>';
  else if(rev.state==='reviewed')badges+='<span class="card-badge badge-review">✓ REVIEWED</span>';
  const g=l.group&&groupIndex[l.group.property_id];
  if(g&&l.id===g.primary_id)badges+='<span class="card-badge badge-review">⧉ '+g.n_ads+' ADS</span>';
  const badgeBox=node.querySelector('.badges');
  if(badgeBox)badgeBox.innerHTML=badges;
  const btns=node.querySelectorAll('.card-actions .mini-btn');
  if(btns[0])btns[0].classList.toggle('on',rev.state==='shortlist');
  if(btns[1])btns[1].classList.toggle('on',rev.state==='reviewed');
  if(btns[2])btns[2].classList.toggle('on',rev.state==='dismissed');
  let noteEl=node.querySelector('.rev-note');
  if(rev.note){
    if(noteEl)noteEl.innerHTML='📝 '+esc(rev.note);
    else{const el=document.createElement('span');el.className='rev-note';el.innerHTML='📝 '+esc(rev.note);
      node.querySelector('.card-actions').before(el)}
  }else if(noteEl)noteEl.remove();
}

let lastFocused=null,modalToken=0;
function openModal(id){
  const token=++modalToken;            // generation token: only the newest request may render
  lastFocused=document.activeElement;
  const l=(allListings.find(x=>x.id===id));if(!l)return;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modalPanel').innerHTML=
    '<button class="close" onclick="closeModal()" aria-label="Close details">✕</button>'+
    '<h2>'+money(l.price_eur)+'</h2><div class="fmissing">Loading full details…</div>';
  document.getElementById('modalPanel').querySelector('.close').focus();
  fetch('api/details/'+encodeURIComponent(id)+'.json')
    .then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()})
    .then(d=>{if(token===modalToken)renderDetail(d)})       // stale responses are dropped
    .catch(()=>{if(token===modalToken)renderDetail(l)});    // controlled fallback to summary data
}
function openGroup(pid){
  modalToken++;                        // invalidate any in-flight detail request
  lastFocused=document.activeElement;
  const g=groupIndex[pid];if(!g)return;
  const rowsHtml=(g.ads||[]).map(a=>{
    const m=(allListings.find(x=>x.id===a.ad_id))||{};
    const h=(m.history||[]);
    return '<div class="adrow"><a href="'+esc(a.url||m.url||'#')+'" target="_blank" rel="noopener noreferrer">'+esc(a.source_id||a.ad_id)+'</a>'+
      ' — '+money(a.price_eur)+(a.instances>1?' (seen '+a.instances+'×)':'')+
      ' <span class="sp">· score '+((m.score_v2!=null)?m.score_v2:'—')+
      ' · '+((m.dates||{}).first_seen?('seen since '+fmtShort(m.dates.first_seen)):'?')+'</span>'+
      ' <button class="btn" style="padding:4px 10px" onclick="openModal(\''+esc(a.ad_id)+'\')">Details</button>'+
      (h.length>1?' <span class="sp">own history: '+h.map(p=>fmtShort(p.date)+' '+money(p.price)).join(' → ')+'</span>':'')+
      '</div>';
  }).join('');
  const pr=g.prices_all||[];
  document.getElementById('modal').classList.add('open');
  document.getElementById('modalPanel').innerHTML=
    '<button class="close" onclick="closeModal()" aria-label="Close group view">✕</button>'+
    '<h2>Property '+esc(g.property_id)+'</h2>'+
    '<div>'+(g.level==='likely'?'Matched with high confidence — one physical property':'Medium confidence — verify manually')+' · '+g.n_ads+' advertisements'+
    (pr.length>1?' · asking '+money(Math.min.apply(null,pr))+'–'+money(Math.max.apply(null,pr)):'')+'</div>'+
    '<div class="ev">Each advertisement keeps its own price history and link; nothing is merged. If the asking prices differ, verify on the ad pages — the latest observation is the current asking price.</div>'+rowsHtml;
  document.getElementById('modalPanel').querySelector('.close').focus();
}
function renderDetail(l){
  const mv=l.movement||{},ch=l.characteristics||{},d=l.dates||{},sb=l.score_breakdown||{},loc=l.location||{};
  const det=l.detail||{};
  const photos=(det.photo_urls||[]).filter(u=>/https:\/\/m\d+\.[a-z]+\.gr\//.test(u));
  const tri=v=>v==='yes'?'<td class="v" style="color:var(--good)">yes</td>':(v==='no'?'<td class="v" style="color:#c9a0ff">no</td>':'<td class="v fmissing">unknown</td>');
  let charRows='';
  [['elevator','Elevator'],['parking','Parking'],['storage','Storage'],['heating_gas','Gas heating'],
   ['heating_autonomous','Autonomous heating'],['furnished','Furnished'],['no_commission','No commission']].forEach(kp=>{
    const c=ch[kp[0]]||{state:'unknown'};
    charRows+='<tr><td>'+kp[1]+'</td>'+tri(c.state)+'<td class="ev">'+esc(c.evidence||'')+'</td></tr>';
  });
  if(ch.heating&&ch.heating.state&&ch.heating.state!=='unknown')
    charRows+='<tr><td>Heating type</td><td class="v">'+esc(ch.heating.label||ch.heating.state)+'</td><td class="ev">'+esc(ch.heating.evidence||'')+'</td></tr>';
  // ENUM characteristic (renovation) uses its own label — never the boolean formatter
  const ren=ch.renovation||{state:'unknown',label:'Unknown condition'};
  const renCls=(ren.state==='renovated'||ren.state==='new_build')?'var(--good)':(ren.state==='needs_renovation'?'var(--bad)':'var(--warn)');
  const renRow='<tr><td>Renovation / condition</td><td class="v" style="color:'+renCls+'">'+esc(ren.label||"Unknown condition")+'</td><td class="ev">'+esc(ren.evidence||'')+'</td></tr>';
  const yr=(ch.year_built||{}),en=(ch.energy_class||{});
  const yrRow='<tr><td>Construction year</td>'+(yr.state==='known'?'<td class="v">'+yr.value+'</td>':'<td class="v fmissing">unknown</td>')+'<td class="ev">'+esc(yr.evidence||'')+'</td></tr>';
  const enLabel=(en.state==='exempt')?'No certificate required (exempt)':(en.state==='pending')?'Certificate under issuance':null;
  const enRow='<tr><td>Energy class</td>'+(en.state==='known'?'<td class="v">'+esc(en.value)+'</td>':(enLabel?'<td class="v">'+esc(enLabel)+'</td>':'<td class="v fmissing">unknown</td>'))+'<td class="ev">'+esc(en.evidence||'')+'</td></tr>';
  // server-computed, unit-tested history rows (arrow = change vs PREVIOUS DISTINCT price)
  const hist=(l.history_rows&&l.history_rows.length)?l.history_rows:(l.history||[]);
  const histHtml=hist.length?hist.map((h,i)=>{
    const arrow=h.direction==='down'?('<span class="mv-down">↓ '+Math.abs(h.change_eur||0).toLocaleString('en-US')+' € ('+(h.pct_change<0?'−':'+')+Math.abs(h.pct_change||0).toFixed(1)+'%)</span>')
      :(h.direction==='up'?('<span class="mv-up">↑ '+Math.abs(h.change_eur||0).toLocaleString('en-US')+' € (+'+(h.pct_change||0).toFixed(1)+'%)</span>'):'');
    return '<div class="histrow"><span class="d">'+esc(h.date||'')+'</span><span class="p">'+money(h.price)+'</span>'+
      '<span class="c">'+((h.n_observations>1)?'('+(h.n_observations)+' observations) ':'')+
      (h.direction==='first'?'first observed price':arrow)+'</span></div>';
  }).join(''):'<div class="fmissing">No dated price observations recorded for this advertisement.</div>';
  const factors=(sb.factors||[]).map(f=>f.state==='known'
    ?'<tr class="frow"><td>'+esc(f.factor)+'</td><td class="v">'+f.pts+' / '+f.max+'</td><td class="ev">'+esc(f.why)+'</td></tr>'
    :'<tr class="frow"><td class="fmissing">'+esc(f.factor)+'</td><td class="v fmissing">n/a</td><td class="ev fmissing">missing data — excluded from score</td></tr>').join('');
  const strengths=(sb.strengths||[]).map(s=>'✓ '+esc(s)).join(' · ');
  const grpAds=((l.group||{}).ads||[{url:l.url,source_id:l.id,price_eur:l.price_eur,ad_id:l.id}])
    .filter(a=>a&&a.url).map(a=>'<div>· <a href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer">'+esc(a.source_id)+'</a> — '+money(a.price_eur)+' <button class="btn" style="padding:3px 10px;font-size:12px" onclick="openModal(\''+esc(a.ad_id)+'\')">details</button></div>').join('')
    ||'<div class="fmissing">Snapshot card without a source link (snapshot extraction).</div>';
  let locHtml='<div>Source label: <b>'+esc(loc.advertised||'—')+'</b>'+(loc.title_city&&loc.title_city!==loc.advertised_city?' · from ad title/first line: <b>'+esc(loc.title_city)+'</b>':'')+'</div>';
  if(loc.mismatch)locHtml+='<div class="loc-warn">⚠ The advertisement text points to a different area than the search label.</div>';
  if(loc.ambiguous)locHtml+='<div class="loc-warn">⚠ Text mentions multiple areas: '+esc((loc.actual_tags||[]).join(', '))+'.</div>';
  locHtml+='<div class="ev">'+esc(loc.evidence||'')+'</div>';
  if(loc.in_scope===false)locHtml+='<div class="loc-warn">Outside the configured geographic scope of this search.</div>';
  const ppsTxt=(l.price_eur&&l.size_sqm>0)?('Asking '+Math.round(l.price_eur/l.size_sqm)+' €/sqm'):('—');
  const valTxt=(l.valuation&&l.valuation.diff_pct_vs_median!=null)
    ?(' · comparable median '+Math.round(l.valuation.median_pps)+' €/sqm ('+(l.valuation.diff_pct_vs_median>0?'+':'')+l.valuation.diff_pct_vs_median+'% vs median · '+l.valuation.n_comparables+' comparables) — asking prices, not completed transactions.')
    :(' · no reliable comparable median yet.');
  const gpTxt=(l.group_pricing&&l.group_pricing.max_active_price>l.group_pricing.min_active_price)
    ?('<div class="ev">Same property advertised at '+money(l.group_pricing.min_active_price)+'–'+money(l.group_pricing.max_active_price)+
      ' across '+l.group_pricing.n_ads+' ads — ranking uses the lowest active asking price ('+money(l.price_effective)+'). Verify which ad you negotiate on.</div>')
    :'';
  document.getElementById('modalPanel').innerHTML=
    '<button class="close" onclick="closeModal()" aria-label="Close details">✕</button>'+
    '<h2>'+money(l.price_eur)+' '+(mv.direction==='down'?'<span class="mv-down">↓ '+Math.abs(mv.abs_change||0).toLocaleString('en-US')+' € ('+(mv.pct_change<0?'−':'+')+Math.abs(mv.pct_change||0).toFixed(1)+'%)</span>':(mv.direction==='up'?'<span class="mv-up">↑ +'+(mv.pct_change||0).toFixed(1)+'%</span>':''))+'</h2>'+
    '<div class="card-area">'+esc(l.area||'')+(loc.mismatch?' ('+esc(loc.actual_city)+')':'')+'</div>'+
    gpTxt+
    '<h3>Overview</h3><table>'+
    '<tr><td>Size</td><td class="v">'+(l.size_sqm>0?esc(String(l.size_sqm))+' sqm':'—')+'</td><td class="ev">'+ppsTxt+'</td></tr>'+
    '<tr><td>Bedrooms / floor</td><td class="v">'+(l.bedrooms!=null&&l.bedrooms!==''?esc(String(l.bedrooms)):'—')+' / '+(l.floor!=null&&l.floor!==''?esc(String(l.floor)):'—')+'</td><td class="ev"></td></tr>'+
    '<tr><td>Published</td><td class="v">'+(d.published?esc(d.published):'unknown')+'</td><td class="ev">'+(d.published_missing?'the source did not provide this date':'from the source advertisement')+'</td></tr>'+
    '<tr><td>Discovered by tracker</td><td class="v">'+(d.first_seen?esc(d.first_seen):'—')+'</td><td class="ev"></td></tr>'+
    '<tr><td>Last seen</td><td class="v">'+(d.last_seen?esc(d.last_seen):'—')+'</td><td class="ev">'+(l.stale?'stale — not confirmed for a long time':'')+'</td></tr>'+
    '<tr><td>Last price update / checked</td><td class="v">'+(d.last_updated?esc(d.last_updated):'—')+' · '+(d.last_checked?esc(d.last_checked):'—')+'</td><td class="ev"></td></tr>'+
    '<tr><td>Score / data confidence</td><td class="v">'+(l.score_v2!=null?l.score_v2:'—')+' ('+esc(l.score_v2_profile||'')+') / '+(l.data_confidence!=null?l.data_confidence+'%':'—')+'</td><td class="ev">attractiveness and data quality are separate metrics'+((l.score!=null)?(' · legacy parser score: '+l.score):'')+'</td></tr></table>'+
    (l.status_label?'<div style="margin-top:6px"><span class="card-badge '+(l.status_label==='NEW ON MARKET'?'badge-newmarket':(l.status_label==='NEWLY DISCOVERED'?'badge-newdisc':'badge-updated'))+'">'+esc(l.status_label)+'</span></div>':'')+
    '<h3>Score explanation'+(l.score_v2_profile?' ('+esc(l.score_v2_profile)+'-profile)':'')+'</h3><table>'+factors+'</table>'+
    (strengths?'<div style="margin-top:6px">Strengths: '+strengths+'</div>':'')+
    ((sb.weaknesses||[]).length?'<div style="margin-top:4px;color:var(--warn)">Watch-outs: '+sb.weaknesses.map(s=>esc(s)).join(' · ')+'</div>':'')+
    '<h3>Price history</h3>'+histHtml+
    '<h3>Characteristics</h3><table>'+charRows+renRow+yrRow+enRow+'</table>'+
    '<h3>Location</h3>'+locHtml+
    '<h3>Description</h3><p style="white-space:pre-wrap;max-height:240px;overflow:auto;font-size:13px">'+esc(det.description||l.desc||'')+'</p>'+
    (photos.length?'<h3>Photos</h3><div class="ph">'+photos.map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Photo '+(i+1)+'</a>').join('')+'</div>':'')+
    '<h3>Original advertisement'+(((l.group||{}).n_ads>1)?'s (all '+l.group.n_ads+' ads)':'')+'</h3><div class="ph">'+grpAds+'</div>';
  const c=document.getElementById('modalPanel').querySelector('.close');
  if(c)c.focus();
}
function closeModal(){
  modalToken++;                        // no stale response may update a closed modal
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalPanel').innerHTML='';
  if(lastFocused&&lastFocused.focus)lastFocused.focus();
  lastFocused=null;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  // focus trap: keep Tab inside the open modal panel
  if(e.key==='Tab'&&document.getElementById('modal').classList.contains('open')){
    const panel=document.getElementById('modalPanel');
    const f=panel.querySelectorAll('button,[href],input,select,textarea');
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
document.getElementById('refreshBtn').addEventListener('click',loadAll);
document.getElementById('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({format:'house-tracker-reviews-v1',exported:new Date().toISOString(),reviews:reviews()},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='house-tracker-reviews.json';a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const parsed=JSON.parse(rd.result);
      const incoming=(parsed&&parsed.reviews)?parsed.reviews:parsed;
      if(typeof incoming!=='object'||incoming===null||Array.isArray(incoming))throw new Error('unexpected file format');
      // VALIDATE BEFORE MERGING: no partial writes, no prototype pollution,
      // listing-id keys only, whitelisted states, bounded notes.
      const VALID_STATES=['shortlist','reviewed','dismissed','none'];
      const ID_RE=/^[A-Za-z0-9_.\-]{3,64}$/;
      const clean={};let imported=0,skipped=0;
      for(const key of Object.keys(incoming)){
        if(key==='__proto__'||key==='constructor'||key==='prototype'||!ID_RE.test(key)){skipped++;continue}
        const ent=incoming[key];
        if(!ent||typeof ent!=='object'||Array.isArray(ent)){skipped++;continue}
        const state=VALID_STATES.indexOf(ent.state)>=0?ent.state:'none';
        const note=(typeof ent.note==='string')?ent.note.slice(0,500):'';
        if(state==='none'&&!note){skipped++;continue}
        clean[key]={state};
        if(note)clean[key].note=note;
        if(typeof ent.at==='string'&&/^\d{4}-\d{2}-\d{2}/.test(ent.at))clean[key].at=ent.at;
        if(ent.snap&&Number.isFinite(+ent.snap.price))clean[key].snap={price:+ent.snap.price};
        imported++;
      }
      const rev=reviews();
      let notesKept=0;
      for(const k of Object.keys(clean)){
        const cur=rev[k]||{};
        if(!clean[k].note&&cur.note){clean[k].note=cur.note;notesKept++;} // conflict rule: import wins on state, existing notes survive
        rev[k]=clean[k];
      }
      localStorage.setItem(REV_KEY,JSON.stringify(rev));
      render();
      alert('Imported '+imported+' review decision(s)'+(notesKept?' ('+notesKept+' existing notes kept)':'')+
            (skipped?' · skipped '+skipped+' invalid entr(ies)':'')+'.');
    }catch(err){alert('Import failed: '+err.message+' — no changes were made.')}
  };
  rd.readAsText(f);
  e.target.value='';   // allow re-importing the same file
});
// persist UI state (filter/sort/search) across reloads
(function(){
  try{
    const st=JSON.parse(localStorage.getItem(UI_KEY))||{};
    if(st.filter)setSelect('filter',st.filter);
    if(st.sort)setSelect('sort',st.sort);
    if(st.search)document.getElementById('search').value=st.search;
  }catch(e){}
  function setSelect(id,v){
    const el=document.getElementById(id);
    for(const o of el.options){if(o.value===v){el.value=v;return}}
  }
  ['filter','sort','search'].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener(id==='search'?'input':'change',function(){
      try{
        localStorage.setItem(UI_KEY,JSON.stringify({
          filter:document.getElementById('filter').value,
          sort:document.getElementById('sort').value,
          search:(document.getElementById('search').value||'').slice(0,200)}));
      }catch(e){}
    });
  });
})();
loadAll();
</script>
